[build-system]
requires = ["meson-python>=0.15.0", "numpy>=1.22", "ninja"]
build-backend = "mesonpy"

[project]
name = "optop"
version = "1.0.0"
description = "Order-parameter computation (Fortran/MPI) and XGBoost phase classification for molecular trajectories"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Diksha Kadre", email = "dikshakadre@iisc.ac.in" }]
keywords = ["order-parameters", "steinhardt", "molecular-dynamics", "machine-learning", "phase-classification", "gas-hydrates"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Fortran",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.22",
  "pandas",
  "scikit-learn",
  "xgboost",
  "mlxtend",
  "matplotlib",
]

[project.optional-dependencies]
mpi = ["mpi4py"]

[project.scripts]
OptOP = "optop.cli:main"
optop = "optop.cli:main"
# Backwards-compatibility alias: this repository previously published the OP_ML
# distribution, whose entry point was `OP_ML`. Keeping the name means existing
# scripts and job files continue to work after the rename to OptOP.
OP_ML = "optop.cli:main"

[project.urls]
Homepage = "https://github.com/EnCRiPT-IISc/Polymorph-Classifier"
Repository = "https://github.com/EnCRiPT-IISc/Polymorph-Classifier"
