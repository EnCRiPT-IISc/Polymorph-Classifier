[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "OP_ML"
version = "1.0.0"
description = "Order Parameter computation (Fortran+MPI) and ML phase classification"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "xgboost>=1.5",
    "mlxtend>=0.20",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
mpi = ["mpi4py>=3.0"]

[project.scripts]
OP_ML = "op_ml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/op_ml"]
